<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Actual model requests and MCP calls for the partial-delivery case</title><desc id="desc">Granular: three model requests with an order lookup then four parallel lookups, 5.288 seconds total. Focused: two model requests with one context lookup, 2.832 seconds total. Tool execution takes about three milliseconds per batch on in-memory data.</desc>
