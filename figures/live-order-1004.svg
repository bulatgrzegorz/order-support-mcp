 stroke="#3A3936"/>
<text x="44" y="558" font-size="15" fill="#A8A69D">Bars: elapsed model HTTP requests. Dots mark local MCP calls, too brief to show as duration bars at this scale.</text>
<text x="44" y="584" font-size="15" fill="#A8A69D">The four-call batch retrieves payment, two reservations and tracking concurrently. Startup/discovery excluded.</text></g></svg>